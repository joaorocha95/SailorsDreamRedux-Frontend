<!doctype html>
<!--
  The single page the whole client is served from.

  `lang` is not decorative: a screen reader picks its pronunciation rules from it, and an empty
  value — which is what the Vite scaffold ships — leaves that to a guess. The copy here is English,
  so it says so.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />

    <!--
      Required for the fluid type scale to mean anything. Every `--step-*` token is a `clamp()`
      against the viewport width, and without this meta a phone reports a ~980px viewport and
      renders the desktop layout shrunk to fit.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Only the display face is preloaded, and only its `latin` slice.

      Without this, the browser learns the headline needs Instrument Serif three round trips in:
      HTML, then the stylesheet, then the `@font-face` inside it. The largest text on every page
      would render in Georgia and reflow when the real face arrived. `crossorigin` is required
      even for a same-origin font — fonts are fetched in CORS mode, and a preload without it is
      fetched a second time rather than reused.

      The other five faces are deliberately not preloaded: DM Sans and JetBrains Mono swap far
      less visibly at body and figure sizes, and the `latin-ext` slices are only needed if a page
      actually contains those characters.
    -->
    <link
      rel="preload"
      href="/fonts/instrument-serif-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- The tab title, and the name a bookmark takes. -->
    <title>Sailor's Dream</title>
  </head>
  <body>
    <!-- Vue mounts here; see `src/main.ts`. Empty on purpose — there is no server-rendered shell,
         so this file is the same three lines whatever page the visitor asked for, and the router
         decides the rest on the client. -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
